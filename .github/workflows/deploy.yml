name: Deploy Website

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "index.html,Dockerfile,compose.yaml"
          target: "/home/devops/site"

      - name: Deploy versioned image
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VERSION
          script: |
            cd /home/devops/site

            SHORT_SHA=$(echo "$VERSION" | cut -c1-7)
            NEW_IMAGE="site-web:$SHORT_SHA"
            DEPLOY_LOG="/home/devops/site/deploy.log"

            # 记录当前生产环境镜像，用于失败回滚
            OLD_IMAGE=$(docker inspect my-website --format='{{.Config.Image}}' 2>/dev/null || true)

            echo "======================================"
            echo "Old version: $OLD_IMAGE"
            echo "New version: $NEW_IMAGE"
            echo "======================================"

            # 写入部署开始记录
            echo "[$(date '+%F %T')] START $NEW_IMAGE" >> "$DEPLOY_LOG"

            # 构建新版本
            echo "Building new image..."
            docker build -t "$NEW_IMAGE" .

            # 删除旧容器
            docker rm -f my-website 2>/dev/null || true

            # 启动新版本
            echo "Starting new version..."

            docker run -d \
              --name my-website \
              --restart unless-stopped \
              -p 8080:80 \
              "$NEW_IMAGE"

            echo "Waiting for application..."
            sleep 5

            # Health Check
            if curl -fs http://127.0.0.1:8080 > /dev/null; then

              echo "DEPLOY SUCCESS: $NEW_IMAGE"

              # 写入成功记录
              echo "[$(date '+%F %T')] SUCCESS $NEW_IMAGE" >> "$DEPLOY_LOG"

              # 清理无用 Docker 数据
              echo "Cleaning unused Docker data..."

              docker image prune -f
              docker builder prune -f

              echo "Cleanup finished"

            else

              echo "DEPLOY FAILED: $NEW_IMAGE"

              # 写入失败记录
              echo "[$(date '+%F %T')] FAILED $NEW_IMAGE" >> "$DEPLOY_LOG"

              echo "Saving failed container logs..."

              # 把失败容器日志保存到 Actions
              docker logs my-website || true

              # 删除失败的新版本容器
              docker rm -f my-website || true

              # 如果存在旧版本，就自动回滚
              if [ -n "$OLD_IMAGE" ]; then

                echo "Rolling back to $OLD_IMAGE"

                docker run -d \
                  --name my-website \
                  --restart unless-stopped \
                  -p 8080:80 \
                  "$OLD_IMAGE"

                sleep 3

                # 检查回滚是否成功
                if curl -fs http://127.0.0.1:8080 > /dev/null; then

                  echo "ROLLBACK SUCCESS: $OLD_IMAGE"

                  echo "[$(date '+%F %T')] ROLLBACK $NEW_IMAGE -> $OLD_IMAGE" >> "$DEPLOY_LOG"

                else

                  echo "ROLLBACK FAILED"

                  echo "[$(date '+%F %T')] ROLLBACK_FAILED $OLD_IMAGE" >> "$DEPLOY_LOG"

                fi

              else

                echo "No old image available for rollback"

                echo "[$(date '+%F %T')] NO_ROLLBACK_IMAGE" >> "$DEPLOY_LOG"

              fi

              # 让 GitHub Actions 显示红色
              exit 1

            fi

            echo "======================================"
            echo "Current running container:"
            docker ps --filter name=my-website
            echo "======================================"