name: Deploy Website

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:

  # 第一阶段：Staging 测试环境
  staging:
    test:
      name: 自动化测试
      runs-on: ubuntu-latest

    steps:
      - name: 获取代码
        uses: actions/checkout@v4

      - name: 运行网站测试
        run: |
          chmod +x test.sh
          ./test.sh
    name: Staging Test
    runs-on: ubuntu-latest
    need: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "index.html,Dockerfile,compose.yaml"
          target: "/home/devops/site"

      - name: Deploy and test Staging
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VERSION
          script: |
            cd /home/devops/site

            SHORT_SHA=$(echo "$VERSION" | cut -c1-7)
            NEW_IMAGE="site-web:$SHORT_SHA"
            DEPLOY_LOG="/home/devops/site/deploy.log"

            echo "======================================"
            echo "STAGING VERSION: $NEW_IMAGE"
            echo "======================================"

            echo "[$(date '+%F %T')] START $NEW_IMAGE" >> "$DEPLOY_LOG"

            # 构建新版本
            docker build -t "$NEW_IMAGE" .

            # 删除旧 Staging
            docker rm -f staging-website 2>/dev/null || true

            # 启动新 Staging
            docker run -d \
              --name staging-website \
              --restart unless-stopped \
              -p 8081:80 \
              "$NEW_IMAGE"

            echo "Waiting for Staging..."
            sleep 5

            # HTTP + 页面内容健康检查
            if curl -fs http://127.0.0.1:8081 > /tmp/staging.html \
              && grep -q "欢迎来到我的企业网站" /tmp/staging.html; then

              echo "STAGING CHECK PASSED"

              echo "[$(date '+%F %T')] STAGING_PASS $NEW_IMAGE" >> "$DEPLOY_LOG"

            else

              echo "STAGING CHECK FAILED"

              echo "[$(date '+%F %T')] STAGING_FAILED $NEW_IMAGE" >> "$DEPLOY_LOG"

              docker logs staging-website || true
              docker rm -f staging-website || true

              echo "Production was NOT changed."

              exit 1

            fi


  # ==========================================
  # 第二阶段：Production 正式环境
  # ==========================================
  production:
    name: Production Deploy

    # Staging 成功后才能来到这里
    needs: staging

    runs-on: ubuntu-latest

    # 这里连接刚创建的 GitHub Environment
    # Required reviewers 会在这里拦住部署
    environment:
      name: production

    steps:
      - name: Deploy Production
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VERSION
          script: |
            cd /home/devops/site

            SHORT_SHA=$(echo "$VERSION" | cut -c1-7)
            NEW_IMAGE="site-web:$SHORT_SHA"
            DEPLOY_LOG="/home/devops/site/deploy.log"

            # 记录当前 Production 版本
            OLD_IMAGE=$(docker inspect my-website --format='{{.Config.Image}}' 2>/dev/null || true)

            echo "======================================"
            echo "OLD PRODUCTION: $OLD_IMAGE"
            echo "NEW PRODUCTION: $NEW_IMAGE"
            echo "======================================"

            # 删除旧 Production 容器
            docker rm -f my-website 2>/dev/null || true

            # 启动新 Production
            docker run -d \
              --name my-website \
              --restart unless-stopped \
              -p 8080:80 \
              "$NEW_IMAGE"

            echo "Waiting for Production..."
            sleep 5

            # HTTP + 页面内容健康检查
            if curl -fs http://127.0.0.1:8080 > /tmp/production.html \
              && grep -q "欢迎来到我的企业网站" /tmp/production.html; then

              echo "PRODUCTION DEPLOY SUCCESS"

              echo "[$(date '+%F %T')] SUCCESS $NEW_IMAGE" >> "$DEPLOY_LOG"

              # 清理无用镜像和构建缓存
              docker image prune -f
              docker builder prune -f

            else

              echo "PRODUCTION DEPLOY FAILED"

              echo "[$(date '+%F %T')] FAILED $NEW_IMAGE" >> "$DEPLOY_LOG"

              # 保存失败版本日志
              docker logs my-website || true

              # 删除失败 Production
              docker rm -f my-website || true

              # ======================================
              # 自动回滚
              # ======================================

              if [ -n "$OLD_IMAGE" ]; then

                echo "ROLLING BACK TO: $OLD_IMAGE"

                docker run -d \
                  --name my-website \
                  --restart unless-stopped \
                  -p 8080:80 \
                  "$OLD_IMAGE"

                sleep 3

                # 检查回滚后的 Production
                if curl -fs http://127.0.0.1:8080 > /tmp/rollback.html \
                  && grep -q "欢迎来到我的企业网站" /tmp/rollback.html; then

                  echo "ROLLBACK SUCCESS"

                  echo "[$(date '+%F %T')] ROLLBACK $NEW_IMAGE -> $OLD_IMAGE" >> "$DEPLOY_LOG"

                else

                  echo "ROLLBACK FAILED"

                  echo "[$(date '+%F %T')] ROLLBACK_FAILED $OLD_IMAGE" >> "$DEPLOY_LOG"

                fi

              else

                echo "NO OLD IMAGE AVAILABLE"

                echo "[$(date '+%F %T')] NO_ROLLBACK_IMAGE" >> "$DEPLOY_LOG"

              fi

              exit 1

            fi

            echo "======================================"
            echo "PRODUCTION FINISHED"
            echo "======================================"

            docker ps --filter name=my-website
      - name: 生成部署报告
        if: always()
        shell: bash
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)

          echo "# 🚀 Production 部署报告" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- 版本：site-web:$SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- 环境：Production" >> "$GITHUB_STEP_SUMMARY"
          echo "- Staging：✅ 已通过" >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ job.status }}" = "success" ]; then
            echo "- Production：✅ 部署成功" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Production：❌ 部署失败，请检查日志" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: 部署失败告警
        if: failure()
        run: |
          echo "::error title=生产环境部署失败::Production 部署失败，请立即检查 Actions 日志"
          echo "🚨 Production deployment failed!"
          echo "Version: ${{ github.sha }}"