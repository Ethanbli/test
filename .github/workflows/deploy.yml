name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "index.html,Dockerfile,compose.yaml"
          target: "/home/devops/site"

      - name: Deploy versioned image
        uses: appleboy/ssh-action@v1
        env:
          VERSION: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: VERSION
          script: |
            cd /home/devops/site

            SHORT_SHA=$(echo "$VERSION" | cut -c1-7)
            NEW_IMAGE="site-web:$SHORT_SHA"

            # 记录当前生产环境镜像，用于失败回滚
            OLD_IMAGE=$(docker inspect my-website --format='{{.Config.Image}}' 2>/dev/null || true)

            echo "Old version: $OLD_IMAGE"
            echo "New version: $NEW_IMAGE"

            # 构建新版本
            docker build -t "$NEW_IMAGE" .

            # 切换到新版本
            docker rm -f my-website 2>/dev/null || true

            docker run -d \
              --name my-website \
              --restart unless-stopped \
              -p 8080:80 \
              "$NEW_IMAGE"

            echo "Waiting for application..."
            sleep 5

            # 健康检查
            if curl -fs http://127.0.0.1:8080 > /dev/null; then
              echo "DEPLOY SUCCESS: $NEW_IMAGE"

              echo "Cleaning unused Docker data..."

              docker image prune -f
              docker builder prune -f

              echo "Cleanup finished"

            else
              echo "DEPLOY FAILED: $NEW_IMAGE"
              echo "Saving failed container logs..."

              docker logs my-website || true
              docker rm -f my-website || true

              # 自动回滚
              if [ -n "$OLD_IMAGE" ]; then
                echo "Rolling back to $OLD_IMAGE"

                docker run -d \
                  --name my-website \
                  --restart unless-stopped \
                  -p 8080:80 \
                  "$OLD_IMAGE"

                sleep 3

                if curl -fs http://127.0.0.1:8080 > /dev/null; then
                  echo "ROLLBACK SUCCESS: $OLD_IMAGE"
                else
                  echo "ROLLBACK FAILED"
                fi
              fi

              exit 1
            fi

            docker ps